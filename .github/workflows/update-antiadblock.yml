name: Update antiadblock filter list

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-antiadblock
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build antiadblock manifest
        run: python3 scripts/build_antiadblock.py

      - name: Commit and push if changed
        id: commit
        run: |
          # Gate on the verbatim upstream file alone. The manifest and NOTICE embed
          # fetched_at, so they differ on every run even when upstream has not moved.
          if [ -n "$(git status --porcelain antiadblock/antiadblock.txt)" ]; then
            git config user.name  "browserguard-bot"
            git config user.email "browserguard-bot@users.noreply.github.com"
            git add antiadblock/antiadblock.txt antiadblock/antiadblock.json antiadblock/NOTICE
            today=$(date -u +'%Y-%m-%d')
            counts=$(python3 -c "import json; c=json.load(open('antiadblock/antiadblock.json'))['counts']; print(', '.join(f'{k}={v}' for k,v in c.items()))")
            upstream_commit=$(python3 -c "import json; print(json.load(open('antiadblock/antiadblock.json'))['upstream_commit'] or 'unpinned')")
            git commit -m "chore: update antiadblock filter list (${today})" -m "Counts: ${counts}"
            git push
            {
              echo "changed=true"
              echo "counts=${counts}"
              echo "upstream_commit=${upstream_commit}"
            } >> "$GITHUB_OUTPUT"
          else
            echo "No upstream change to antiadblock.txt."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COUNTS: ${{ steps.commit.outputs.counts }}
          UPSTREAM_COMMIT: ${{ steps.commit.outputs.upstream_commit }}
        run: |
          today=$(date -u +'%Y.%m.%d')
          notes="${RUNNER_TEMP}/release-notes.md"
          gzip -kf antiadblock/antiadblock.json antiadblock/antiadblock.txt
          (cd antiadblock && sha256sum antiadblock.json antiadblock.txt NOTICE > checksums.txt)
          printf '%s\n' \
            "Daily rebuild of AdGuard's antiadblock filter list." \
            "" \
            "Upstream commit: ${UPSTREAM_COMMIT}" \
            "Counts: ${COUNTS}" \
            "" \
            "antiadblock.txt is an unmodified copy of the upstream section file, GPL-3.0. antiadblock.json is the manifest derived from it. NOTICE carries the licensing and the upstream sha256, and checksums.txt carries sha256sums for those three files." \
            "" \
            "The .gz assets exist because release assets are served as application/octet-stream with no transparent Content-Encoding. The plain JSON is 2.7MB, the gzip is 304KB." \
            > "${notes}"
          gh release create "v${today}" --title "antiadblock ${today}" --notes-file "${notes}" \
              antiadblock/antiadblock.json antiadblock/antiadblock.json.gz \
              antiadblock/antiadblock.txt antiadblock/antiadblock.txt.gz \
              antiadblock/NOTICE antiadblock/checksums.txt \
            || gh release upload "v${today}" antiadblock/antiadblock.json antiadblock/antiadblock.json.gz \
                 antiadblock/antiadblock.txt antiadblock/antiadblock.txt.gz \
                 antiadblock/NOTICE antiadblock/checksums.txt --clobber
